sudo: required
services:
  - docker

before_install:
  - docker build -t saikiran8050/docker-react -f Dockerfile.dev .

script:
  - docker run saikiran8050/docker-react npm run test -- --coverage
  
deploy:
  provider: elasticbeanstalk
  region: "ap-south-1"
  app: "docker-react"
  env: "Docker-react-env"
  bucket_name: "elasticbeanstalk-ap-south-1-428578350734"
  bucket_path: "docker-react"
  access_key_id: $AWS_ACCESS_KEY
  secret_access_key: $AWS_SECRET_KEY