name: Docker React CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            
            - name: Build Docker Image
              run: docker build -t saikiran8050/docker-react -f Dockerfile.dev .
            
            - name: run tests inside docker container
              run: docker run -e CI=true saikiran8050/docker-react npm run test -- --coverage
            
            # Package the app for deployment (zip source for Elastic Beanstalk)
            - name: Zip source bundle
              run: zip -r docker-react.zip . -x "node_modules/*" ".git/*" "docker-react.zip"
            
            - name: Deploy to Elastic Beanstalk
              uses: einaregilsson/beanstalk-deploy@v21
              with:
                  application_name: docker-react
                  environment_name: Docker-react-env
                  version_label: ${{ github.sha }}
                  region: ap-south-1
                  bucket_name: elasticbeanstalk-ap-south-1-428578350734
                  bucket_key: docker-react/docker-react.zip
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}